        Статус(badge) | Должность(grade+role) | + категории и «Результат» из контента.

     2. Возвращён badge() статуса.

<style>
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/russo-one@latest/cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/russo-one@latest/latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-600-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-600-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
:root{
  --bg:#0c0a0e; --bg2:#120d16; --panel:#17111c; --panel2:#1d1524;
  --line:#2b2132; --line2:#3a2c44;
  --red:#d81a3a; --red2:#8e0f24; --red3:#ff3b5c;
  --text:#f4eef2; --muted:#9d92a4; --dim:#6d6377; --th:#cfc4da;
  --disp:'Russo One',sans-serif; --imp:'Imperial','Russo One',sans-serif; --body:'Manrope',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:84px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
.haze{position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(1000px 620px at 82% -10%,rgba(118,42,180,.17),transparent 60%),
             radial-gradient(820px 520px at -10% 46%,rgba(88,22,140,.15),transparent 60%),
             radial-gradient(720px 520px at 52% 112%,rgba(216,26,58,.10),transparent 60%),var(--bg);
  animation:drift 42s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.06)}}
.noise{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.6'/></svg>")}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
a{color:var(--red3);text-decoration:none}
img{display:block;max-width:100%}
.dim{color:var(--dim)}
#err{display:none;margin:14px auto;padding:14px 18px;border:1px solid var(--red3);color:var(--red3);font-weight:600;background:rgba(216,26,58,.08);max-width:1240px}
.nav{position:sticky;top:0;z-index:50;background:rgba(12,10,14,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:grid;place-items:center;margin-right:auto}
.logo img,.logo .logo-text{grid-area:1/1}
.logo img{height:56px;width:auto}
.logo-text{display:none;font-family:var(--imp);font-size:26px;letter-spacing:.08em;color:var(--text);border-left:3px solid var(--red);padding-left:12px;line-height:1}
.logo-text small{display:block;font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.42em;color:var(--red3);margin-top:3px}
.logo img.img-missing{display:none}
.logo img.img-missing + .logo-text{display:block}
.nav nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.nav nav::-webkit-scrollbar{display:none}
.nav nav a{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:color .2s}
.nav nav a:hover{color:var(--red3)}
#langBtn{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--muted);background:var(--panel);border:1px solid var(--line2);padding:8px 12px;cursor:pointer;transition:color .2s,border-color .2s}
#langBtn:hover{color:var(--red3);border-color:rgba(255,59,92,.5)}
.hero{padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:400px 1fr;gap:56px;align-items:stretch}
.frame{position:relative;padding:16px;height:100%}
.frame i{position:absolute;width:26px;height:26px;border:2px solid var(--red)}
.frame i.c1{top:0;left:0;border-right:0;border-bottom:0}
.frame i.c2{top:0;right:0;border-left:0;border-bottom:0}
.frame i.c3{bottom:0;left:0;border-top:0;border-right:0}
.frame i.c4{bottom:0;right:0;border-left:0;border-top:0}
.photo{position:relative;overflow:hidden;background:var(--panel);height:100%;box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(15%) contrast(1.06);animation:breathe 16s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
.photo .ph-fb{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--imp);font-size:64px;color:var(--red2)}
.photo img.img-missing{display:none;animation:none}
.photo::after{content:'';position:absolute;top:0;bottom:0;left:-45%;width:45%;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.05) 35%,rgba(255,255,255,.12) 50%,rgba(255,59,92,.08) 62%,transparent 100%);
  filter:blur(14px);mix-blend-mode:screen;animation:glare 9s linear infinite}
@keyframes glare{from{transform:translateX(0)}to{transform:translateX(320%)}}
.lockup{width:fit-content;max-width:100%}
.brand{font-family:var(--imp);font-size:clamp(44px,7vw,84px);line-height:1;letter-spacing:.06em;margin:0 0 10px;color:var(--text);text-shadow:0 0 34px rgba(216,26,58,.35)}
.lockup h1{font-family:var(--disp);font-size:clamp(20px,2.6vw,28px);color:var(--text);margin:0 0 8px;white-space:nowrap}
.kicker{display:block;font-family:var(--disp);font-weight:400;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--red3);white-space:nowrap}
.hlead{max-width:600px;color:var(--muted);font-size:17px;margin-top:14px}
.stats{margin:30px 0 6px;display:grid;gap:16px;max-width:600px}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end}
.stat .lb{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .num{font-family:var(--disp);font-size:26px;color:var(--red3);line-height:1}
.stat .num em{font-style:normal;font-size:14px;color:var(--dim)}
.bar{grid-column:1/-1;height:6px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--red2),var(--red) 70%,var(--red3));transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
.on .bar .fill{width:var(--w)}
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--bg2)}
.ticker-track{display:flex;width:max-content;animation:tick 30s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker a{padding:13px 20px;font-family:var(--disp);font-size:12px;letter-spacing:.24em;color:var(--muted);white-space:nowrap;transition:color .2s}
.ticker a:hover{color:var(--red3)}
.ticker b{color:var(--red);font-weight:400}
@keyframes tick{to{transform:translateX(-50%)}}
section{padding:78px 0}
h2{font-family:var(--disp);font-size:clamp(26px,3.6vw,40px);letter-spacing:.03em;margin-bottom:26px;display:flex;align-items:baseline;gap:18px}
h2 .idx{font-size:.55em;color:var(--red);letter-spacing:.1em}
.hrow{display:flex;align-items:baseline;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.hrow h2{margin-bottom:0}
.vmode{margin-left:auto;display:flex;gap:8px}
.vmode button{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line2);padding:8px 14px;cursor:pointer;transition:color .2s,border-color .2s}
.vmode button.active{color:var(--red3);border-color:rgba(255,59,92,.5)}
/* витрина: грид = 100% .wrap; стрелки absolute вне потока */
.show-wrap{position:relative}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%}
.pages::-webkit-scrollbar{display:none}
.page{min-width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;scroll-snap-align:start;align-content:start}
.sl-btns{position:absolute;top:50%;transform:translateY(-50%);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:3}
.sl-btns button{pointer-events:auto;width:44px;height:44px;font-family:var(--disp);font-size:16px;color:var(--text);background:rgba(12,10,14,.78);border:1px solid var(--line2);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.sl-btns button:hover{border-color:rgba(255,59,92,.5);color:var(--red3)}
@media (min-width:1360px){.sl-btns{left:-56px;right:-56px}.sl-btns button{background:var(--panel)}}
.card{background:var(--panel);border:1px solid var(--line);position:relative;transition:transform .35s,border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-7px);border-color:var(--red2);box-shadow:0 22px 50px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;top:-1px;left:-1px;width:22px;height:22px;border-top:2px solid var(--red);border-left:2px solid var(--red);z-index:2;transition:width .3s,height .3s}
.card:hover::before{width:44px;height:44px}
.cover{position:relative;overflow:hidden;aspect-ratio:16/9;background:var(--panel2)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1);filter:saturate(.92)}
.card:hover .cover img{transform:scale(1.07)}
.cover-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:4px;
  background:linear-gradient(150deg,var(--panel2) 0%,var(--red2) 140%),repeating-linear-gradient(-45deg,transparent 0 14px,rgba(216,26,58,.07) 14px 15px)}
.cover-ph b{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--text)}
.cover-ph span{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--red3)}
.st{position:absolute;top:12px;right:12px;padding:5px 12px;font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;background:rgba(12,10,14,.82);border:1px solid;z-index:2}
.cv-genre{position:absolute;left:12px;bottom:12px;padding:5px 12px;font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;background:rgba(12,10,14,.82);border:1px solid var(--line2);color:var(--text);z-index:2}
.cbody{padding:22px 22px 24px}
.cbody h3{font-family:var(--disp);font-size:19px;letter-spacing:.03em;margin-bottom:8px}
.cbody .company{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.cbody p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.clink{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.clink:hover{text-shadow:0 0 14px rgba(255,59,92,.6)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:1080px;font-size:14px}
table.wide{min-width:1500px}
th{font-family:var(--disp);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--th);text-align:center;padding:14px 16px;border-bottom:1px solid var(--line2);background:var(--bg2);white-space:nowrap}
th.left{text-align:left}
#projTable th[data-key]{cursor:pointer;user-select:none}
#projTable th[data-key]::after{content:'↕';margin-left:8px;opacity:.35;font-family:var(--body)}
#projTable th[data-key].asc::after{content:'↑';opacity:1;color:var(--red3)}
#projTable th[data-key].desc::after{content:'↓';opacity:1;color:var(--red3)}
td{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle;text-align:center}
td.left{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(216,26,58,.06)}
tr.grp td{background:var(--bg2);color:var(--red3);font-family:var(--disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;text-align:left;cursor:default}
.pn{color:var(--text);font-weight:800;font-size:15px}
.pn a{color:var(--text);transition:color .2s}
.pn a:hover{color:var(--red3)}
.comp{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red3);opacity:.8;margin-top:4px}
a.comp:hover{opacity:1;text-decoration:underline}
.meta{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
.badge{display:inline-block;padding:4px 10px;font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid;background:rgba(12,10,14,.5)}
.td-period .p-line{display:block;white-space:nowrap}
.td-period .dim{display:block;margin-top:3px}
.td-role .g{display:block;color:var(--red3);font-weight:700}
.td-role .r{display:block;margin-top:2px}
td.res-cell{font-size:12.5px;max-width:280px}
.cellink{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;border:1px solid var(--line2);padding:2px 8px;color:var(--muted)}
.cellink:hover{color:var(--red3);border-color:rgba(255,59,92,.5)}
/* результаты (§15): % центр; чип строкой под %; компакт и «•» — влево */
table.res td{vertical-align:top}
td.res-cell{vertical-align:top}
.rc-pct{font-family:var(--disp);font-size:15px;color:var(--red3);text-align:center}
.rc-dash{color:var(--dim);font-size:14px;text-align:center}
.rc-chips{text-align:center;margin-top:6px}
.rc-chips .cellink{margin:0 3px}
.rc-compact{margin-top:8px;text-align:left;color:var(--muted)}
.rc-li{text-align:left;color:var(--dim);font-size:12px;line-height:1.55}
.pips{display:inline-flex;gap:5px;justify-content:center}
.pips i{width:14px;height:6px;background:var(--line2);transform:skewX(-16deg)}
.pips i.f{background:linear-gradient(90deg,var(--red2),var(--red3))}
td.case a,td.case .casechip{display:inline-block;margin:0 6px 6px 0;font-size:12.5px;font-weight:600;border:1px solid var(--line2);padding:4px 10px;color:var(--muted)}
td.case a:hover{color:var(--red3);border-color:rgba(255,59,92,.5)}
tr.flash{animation:flash 1.2s ease}
@keyframes flash{0%,60%{background:rgba(216,26,58,.22)}100%{background:transparent}}
body[data-view="table"] .show-wrap{display:none}
body[data-view="show"] .tbl-projects{display:none}
.tl-list{position:relative;padding-left:34px;max-width:860px}
.tl-list::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--red),var(--red2) 60%,transparent)}
.tl{position:relative;padding-bottom:38px}
.tl:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-32px;top:6px;width:14px;height:14px;background:var(--bg);border:3px solid var(--red);transform:rotate(45deg)}
.tl-head h3{font-family:var(--disp);font-size:19px;letter-spacing:.04em}
.tl-date{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:4px 0}
.tl-role{color:var(--red3);font-weight:600;font-size:14px;margin:0 0 8px}
.tl p.res{color:var(--muted);font-size:14.5px}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.ecard{border:1px solid var(--line);background:var(--panel);padding:22px;transition:border-color .3s}
.ecard:hover{border-color:var(--red2)}
.ecard .yr{font-family:var(--disp);color:var(--red);font-size:13px;letter-spacing:.14em}
.ecard h3{font-size:16px;margin:8px 0 4px}
.ecard p{color:var(--muted);font-size:13.5px}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:64px 0 40px}
.fgrid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.fbig{line-height:1}
.flogo{height:clamp(80px,12vw,140px);width:auto;max-width:100%}
.fbig-text{display:none;font-family:var(--imp);font-size:clamp(40px,7vw,84px);line-height:1;color:var(--text);text-shadow:0 0 40px rgba(216,26,58,.3);letter-spacing:.06em}
.fbig-text small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.5em;color:var(--red3);margin-top:8px}
.flogo.img-missing{display:none}
.flogo.img-missing + .fbig-text{display:block}
.fcontacts{display:grid;gap:12px;text-align:right}
.fcontacts a{color:var(--muted);font-weight:600;transition:color .2s}
.fcontacts a:hover{color:var(--red3)}
.copy{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;letter-spacing:.06em}
#scrollToTop{position:fixed;bottom:20px;right:20px;width:44px;height:44px;background:var(--red);border:none;border-radius:50%;color:var(--text);font-size:20px;cursor:pointer;display:none;z-index:100;box-shadow:0 8px 24px rgba(216,26,58,.4)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.on{opacity:1;transform:none}
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;gap:40px}
  .frame{max-width:400px;height:auto}
  .photo img{aspect-ratio:4/5;height:auto}
  .page{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .fcontacts{text-align:left}
  .lockup h1,.kicker{white-space:normal}
}
@media (max-width:640px){.page{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){

<script>
(function(){
'use strict';
var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var TR={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
function slug(s){ return String(s).toLowerCase().split('').map(function(ch){ return TR[ch]!==undefined?TR[ch]:ch; }).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }

/* chrome-словарь i18n */
var I18N={
  ru:{showcase:'Витрина',table:'Таблица',onRequest:'по запросу',skill:'Навык',level:'Уровень',experience:'Опыт',cases:'Кейсы',
      project:'Проект',period:'Период',status:'Статус',position:'Должность',
      langBtn:'EN',err:'Не удалось загрузить данные. Портфолио доступно по прямой ссылке:'},
  en:{showcase:'Showcase',table:'Table',onRequest:'on request',skill:'Skill',level:'Level',experience:'Experience',cases:'Cases',
      project:'Project',period:'Period',status:'Status',position:'Position',
      langBtn:'RU',err:'Failed to load data. Portfolio is available via direct link:'}
};

/* канонические ключи секций: RU-имена фикс из 2.2, EN = имя + " EN" */
var NAME_MAP={
  'hero':'hero','метрики':'metrics','порядок витрины':'order','проекты':'projects','проекты-результаты':'results','изображения':'images','навыки и кейсы':'skills','опыт':'exp','образование':'edu','контакты':'contacts','статусы':'statuses','футер':'footer',
  'metrics':'metrics','project showcase order':'order','projects':'projects','projects-results':'results','images':'images','skills and cases':'skills','experience':'exp','education':'edu','contacts':'contacts','statuses':'statuses','footer':'footer'
};
function canonKey(name){
  var low=String(name).toLowerCase().trim();
  if(/ en$/.test(low)){
    var base=low.replace(/ en$/,'').trim();
    if(NAME_MAP[base]!==undefined) return {lang:'en',key:NAME_MAP[base]};
    return null;
  }
  if(NAME_MAP[low]!==undefined) return {lang:'ru',key:NAME_MAP[low]};
  return null;
}
function splitRow(line){ return line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(s){return s.trim();}); }
function isSep(cells){ return cells.every(function(c){ return /^:?-{2,}:?$/.test(c); }); }
/* парсер: «# » по спеке 2.2 + терпит bare-имена; таблицы с пробелами и без; <br>/<br >/<br/> */
function parseMD(src){
  var out={ru:{},en:{}};
  var cur=null;
  src.split(/\r?\n/).forEach(function(raw){
    var line=raw.trim();
    if(!line) return;
    if(line.indexOf('<!--')===0) return;
    if(/^─{6,}$/.test(line)) return; /* разделитель RU/EN */
    var name=null;
    var hm=line.match(/^#\s+(.+)$/);
    if(hm) name=hm[1].trim();
    else if(line.indexOf('|')!==0 && canonKey(line)) name=line;
    if(name){
      var ck=canonKey(name);
      if(ck){ cur={name:name,header:null,rows:[],lines:[]}; out[ck.lang][ck.key]=cur; return; }
    }
    if(cur && line.indexOf('|')===0){
      var cells=splitRow(line);
      if(isSep(cells)) return;
      if(!cur.header){ cur.header=cells; return; }
      var obj={};
      cur.header.forEach(function(k,i){ obj[String(k).toLowerCase()]=(cells[i]||'').trim(); });
      cur.rows.push(obj);
      return;
    }
    if(cur) cur.lines.push(line);
  });
  return out;
}
function kv(rows){
  var o={};
  (rows||[]).forEach(function(r){
    var k=Object.keys(r);
    if(k.length>=2){ o[String(r[k[0]]).toLowerCase().trim()]=r[k[1]]; }
  });
  return o;
}
function parseLinks(cell){
  var out=[], re=/\[([^\]]+)\]\(([^)]+)\)/g, m;
  while((m=re.exec(cell||''))) out.push({label:m[1],url:m[2]});
  return out;
}
function caseChips(cell){
  var links=parseLinks(cell);
  if(links.length) return links.map(function(l){ return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'; }).join('');
  var txt=String(cell||'').trim();
  if(!txt || txt==='–' || txt==='—') return '–';
  return txt.split(';').map(function(s){ s=s.trim(); return s? '<span class="casechip">'+esc(s)+'</span>' : ''; }).join('');
}
/* richCell v2 (§15): % центр; чип отдельной строкой под %; компакт влево (в «Результат» — <b>); «•» влево; «–» как есть */
function cellLines(v){
  return String(v==null?'':v).split(/<br\s*\/?>/i).map(function(s){return s.trim();}).filter(function(s){return s.length;});
}
function richCell(v,isResult){
  var raw=String(v==null?'':v).trim();
  if(!raw || raw==='–' || raw==='—' || raw==='-') return '<div class="rc-dash">–</div>';
  return cellLines(raw).map(function(line){
    if(/^\d+(?:[.,]\d+)?%$/.test(line)) return '<div class="rc-pct">'+esc(line)+'</div>';
    var links=parseLinks(line);
    var noLinks=line.replace(/\[([^\]]+)\]\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
    if(links.length && !noLinks) return '<div class="rc-chips">'+links.map(function(l){ return '<a class="cellink" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'; }).join(' ')+'</div>';
    if(line.indexOf('•')===0) return '<div class="rc-li">'+esc(line)+'</div>';
    var t=esc(noLinks||line);
    links.forEach(function(l){ t+=' <a class="cellink" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'; });
    if(isResult) t='<b>'+t+'</b>';
    return '<div class="rc-compact">'+t+'</div>';
  }).join('');
}
/* компакт для карточки: первая содержательная строка «Результат» без %/чипов/списков, без «:» */
function compactOf(v){
  var lines=cellLines(v);
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\d+(?:[.,]\d+)?%$/.test(line)) continue;
    if(line.indexOf('•')===0) continue;
    var noLinks=line.replace(/\[([^\]]+)\]\([^)]*\)/g,'').trim();
    if(!noLinks) continue;
    return noLinks.replace(/:$/,'').trim();
  }
  return '';
}
var STATUS={}, DATA=null, CUR='ru';
function statusColor(st){
  var s=String(st||'');
  if(STATUS[s]) return STATUS[s];
  var low=s.toLowerCase(), best=null, bi=1e9;
  Object.keys(STATUS).forEach(function(k){
    var i=low.indexOf(k.toLowerCase());
    if(i>-1 && (i<bi || (i===bi && best && k.length>best.length))){ bi=i; best=k; }
  });
  return best?STATUS[best]:'#8a8090';
}
function badge(st){
  var c=statusColor(st);
  return '<span class="badge" style="color:'+c+';border-color:'+c+'80">'+esc(st)+'</span>';
}
/* ключи строк «Проекты» по языкам (lowercase) */
var PK={
  ru:{num:'№',project:'проект',genre:'жанр',platform:'платформа',monetization:'монетизация',status:'статус',company:'компания',period:'период',duration:'срок',engagement:'занятость',position:'должность',companyLink:'ссылка на компанию',projectLink:'ссылка на проект'},
  en:{num:'№',project:'project',genre:'genre',platform:'platform',monetization:'monetization',status:'status',company:'company',period:'period',duration:'duration',engagement:'engagement',position:'position',companyLink:'company link',projectLink:'project link'}
};
function gradeOf(p,K){ return String(p[K.position]||'').split(',')[0].trim(); }
function roleOf(p,K){ var parts=String(p[K.position]||'').split(','); parts.shift(); return parts.join(',').trim(); }
function sec(lang,key){ var s=DATA[lang]&&DATA[lang][key]; if(s) return s; return (DATA.ru&&DATA.ru[key])||null; }
function displayName(s,lang){ return lang==='en'? s.name.replace(/\s+EN$/i,'') : s.name; }
/* сортировка: RU+EN месяцы */
var MON={'янв':1,'фев':2,'мар':3,'апр':4,'май':5,'июн':6,'июл':7,'авг':8,'сен':9,'окт':10,'ноя':11,'дек':12,
         'jan':1,'feb':2,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12};
function periodKey(s){
  var m=String(s).match(/([a-zа-я]+)[^\d]*(\d{4})/i);
  if(m){ var mm=MON[m[1].toLowerCase()]||0; return (+m[2])*12+mm; }
  var y=String(s).match(/(\d{4})/);
  return y? (+y[1])*12 : 0;
}
var sortKey='id', sortDir=-1;
function sortVal(p,key){
  var K=PK[CUR];
  switch(key){
    case 'id': return +p[K.num]||0;
    case 'title': return (p[K.project]||'').toLowerCase();
    case 'period': return periodKey(p[K.period]||'');
    case 'status': return p[K.status]||'';
    case 'grade': return gradeOf(p,K).toLowerCase();
  }
  return 0;
}
/* совмещённая таблица v11: детали + колонки результатов из контента */
function renderTable(key,dir){
  sortKey=key; sortDir=dir;
  var lang=CUR, K=PK[lang], T=I18N[lang];
  var projects=(sec(lang,'projects')||{rows:[]}).rows;
  var resultsSec=sec(lang,'results');
  var resHeads=(resultsSec&&resultsSec.header)? resultsSec.header.slice(1) : [];
  var RK=lang==='en'?'project':'проект';
  var RES={};
  ((resultsSec&&resultsSec.rows)||[]).forEach(function(r){ if(r[RK]) RES[String(r[RK]).toLowerCase()]=r; });
  var rows=projects.slice().sort(function(a,b){
    var va=sortVal(a,key), vb=sortVal(b,key);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
  var html=rows.map(function(p){
    var r=RES[String(p[K.project]||'').toLowerCase()]||{};
    var plink=p[K.projectLink]&&p[K.projectLink]!=='–'?'<a href="'+esc(p[K.projectLink])+'" target="_blank" rel="noopener">'+esc(p[K.project])+'</a>':esc(p[K.project]);
    var comp=p[K.companyLink]&&p[K.companyLink]!=='–'?'<a class="comp" href="'+esc(p[K.companyLink])+'" target="_blank" rel="noopener">'+esc(p[K.company]||'')+'</a>':'<span class="comp">'+esc(p[K.company]||'')+'</span>';
    var term2=(p[K.duration]||'')+(p[K.engagement]? ' · '+p[K.engagement]:'');
    var resCols=resHeads.map(function(h,i){
      return '<td class="left res-cell">'+richCell(r[String(h).toLowerCase()], i===resHeads.length-1)+'</td>';
    }).join('');
    return '<tr>'+
      '<td class="left"><span class="pn">'+plink+'</span>'+comp+'<span class="meta">'+esc(p[K.genre]||'')+' · '+esc(p[K.platform]||'')+' · '+esc(p[K.monetization]||'')+'</span></td>'+
      '<td class="td-period"><span class="p-line">'+esc(p[K.period]||'')+'</span><span class="dim">'+esc(term2)+'</span></td>'+
      '<td>'+badge(p[K.status]||'')+'</td>'+
      '<td class="td-role"><span class="g">'+esc(gradeOf(p,K))+'</span><span class="r">'+esc(roleOf(p,K))+'</span></td>'+
      resCols+'</tr>';
  }).join('');
  function cls(k,extra){ return (extra?extra+' ':'')+(key===k?(dir<0?'desc':'asc'):''); }
  var head='<th data-key="title" class="'+cls('title','left')+'">'+esc(T.project)+'</th>'+
    '<th data-key="period" class="'+cls('period')+'">'+esc(T.period)+'</th>'+
    '<th data-key="status" class="'+cls('status')+'">'+esc(T.status)+'</th>'+
    '<th data-key="grade" class="'+cls('grade')+'">'+esc(T.position)+'</th>'+
    resHeads.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('');
  $('#projTable').innerHTML='<table class="'+(resHeads.length?'wide':'')+'"><thead><tr>'+head+'</tr></thead><tbody>'+html+'</tbody></table>';
}

function render(lang){
  CUR=lang;
  var T=I18N[lang];
  document.documentElement.lang=lang;
  STATUS={};
  (sec(lang,'statuses')||{rows:[]}).rows.forEach(function(s){
    var k=s['статус']||s['status'], c=s['цвет']||s['color'];
    if(k&&c) STATUS[k]=c;
  });
  var hero=kv((sec(lang,'hero')||{rows:[]}).rows);
  var metrics=(sec(lang,'metrics')||{rows:[]}).rows;
  var projects=(sec(lang,'projects')||{rows:[]}).rows;
  var images=(sec(lang,'images')||{rows:[]}).rows;
  var skills=(sec(lang,'skills')||{rows:[]}).rows;
  var resultsSec=sec(lang,'results');
  var orderSec=sec(lang,'order');
  var exp=(sec(lang,'exp')||{rows:[]}).rows;
  var edu=(sec(lang,'edu')||{rows:[]}).rows;
  var contacts=(sec(lang,'contacts')||{rows:[]}).rows;
  var footer=kv((sec(lang,'footer')||{rows:[]}).rows);
  var K=PK[lang];

  var errEl=$('#err');
  if(errEl) errEl.innerHTML=esc(T.err)+' <a href="https://tinyurl.com/Portfolio-SarvasGD">tinyurl.com/Portfolio-SarvasGD</a>';

  var logoPath=hero['logo']||'covers/logo.png';
  var photoPath=hero['photo']||'covers/photo.jpg';
  $$('img[data-role="logo"]').forEach(function(img){ img.src=logoPath; });
  $$('img[data-role="photo"]').forEach(function(img){ img.src=photoPath; });

  var t=hero['title'];
  if(!t){
    var parts=[hero['brand'], ((hero['role']||'')+' '+(hero['name']||'')).trim()].filter(Boolean);
    t=parts.join(' – ');
  }
  document.title=t||'SARVAS';
  $('#hBrand').textContent=hero['brand']||'SARVAS';
  $('#hName').textContent=hero['nameview']||hero['name']||'';
  $('#hRole').textContent=hero['role']||'';
  $('#hTag').textContent=hero['tagline']||'';

  $('#hStats').innerHTML=metrics.map(function(m){
    var val=parseFloat(m['value'])||0;
    var max=parseFloat(m['max'])||0;
    var w=max>0? Math.round(val/max*100) : (parseFloat(m['progress'])||0);
    return '<div class="stat"><span class="lb">'+esc(m['label'])+'</span><span class="num"><span data-to="'+esc(m['value'])+'">0</span> <em>'+esc(m['unit'])+'</em></span><div class="bar"><div class="fill" style="--w:'+w+'%"></div></div></div>';
  }).join('');
  if($('#hero').classList.contains('on')) $$('#hStats [data-to]').forEach(runCount);

  var names={
    projects: displayName(sec(lang,'projects')||{name:T.project},lang),
    skills: displayName(sec(lang,'skills')||{name:''},lang),
    exp: displayName(sec(lang,'exp')||{name:''},lang),
    edu: displayName(sec(lang,'edu')||{name:''},lang),
    contacts: displayName(sec(lang,'contacts')||{name:''},lang)
  };
  $('#tProjects').textContent=names.projects;
  $('#tSkills').textContent=names.skills;
  $('#tExp').textContent=names.exp;
  $('#tEdu').textContent=names.edu;
  $('#nav').innerHTML=[['#projects',names.projects],['#skills',names.skills],['#exp',names.exp],['#edu',names.edu],['#contacts',names.contacts]]
    .map(function(n){ return '<a href="'+n[0]+'">'+esc(n[1])+'</a>'; }).join('');
  $('#nav').setAttribute('aria-label', lang==='en'?'Main navigation':'Основная навигация');
  $('#langBtn').textContent=T.langBtn;
  $('#vShow').textContent=T.showcase;
  $('#vTable').textContent=T.table;
  $('#scrollToTop').setAttribute('aria-label', lang==='en'?'Back to top':'Вернуться в начало страницы');

  var items=skills.filter(function(s){return s['skill'];}).map(function(s){ return '<a href="#skill-'+slug(s['skill'])+'">'+esc(s['skill'])+' <b>◆</b></a>'; }).join('');
  $('#ticker').innerHTML=items+items;

  /* порядок витрины */
  var orderText=((orderSec&&orderSec.lines)||[]).join(' ');
  var orderNums=orderText.match(/\d+/g)||[];
  var ordered=[];
  orderNums.forEach(function(n){
    var p=projects.filter(function(x){ return (+x[K.num])===+n; })[0];
    if(p&&ordered.indexOf(p)<0) ordered.push(p);
  });
  projects.forEach(function(p){ if(ordered.indexOf(p)<0) ordered.push(p); });

  var resByKey={};
  var RK=lang==='en'?'project':'проект';
  ((resultsSec&&resultsSec.rows)||[]).forEach(function(r){ if(r[RK]) resByKey[String(r[RK]).toLowerCase()]=r; });

  function cardHTML(p){
    var title=p[K.project]||'';
    var imgRow=images.filter(function(x){ return String(x[lang==='en'?'project':'проект']||'').toLowerCase()===String(title).toLowerCase(); })[0];
    var img=imgRow? (imgRow[lang==='en'?'image':'изображение']||'') : '';
    if(img==='—'||img==='-') img='';
    var link=p[K.projectLink]&&p[K.projectLink]!=='–'?p[K.projectLink]:null;
    var inner=img? '<img src="'+esc(img)+'" alt="'+esc(title)+' – '+esc(p[K.genre]||'')+'" loading="lazy" onerror="this.style.display=\'none\'">' : '';
    var resRow=resByKey[String(title).toLowerCase()]||{};
    var compact=compactOf(resRow[lang==='en'?'result':'результат']) || (p['достижения']||'');
    var ptag=compact? '<p>'+esc(compact)+'</p>' : '';
    var cl=link? '<a class="clink" href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(host(link))+' →</a>' : '<a class="clink" href="#contacts">'+esc(T.onRequest)+' →</a>';
    var sc=statusColor(p[K.status]);
    return '<article class="card"><div class="cover"><div class="cover-ph"><span>'+esc(p[K.genre]||'')+' · '+esc(p[K.platform]||'')+'</span><b>'+esc(title)+'</b></div>'+inner+
      '<span class="st" style="color:'+sc+';border-color:'+sc+'80">'+esc(p[K.status]||'')+'</span>'+
      '<span class="cv-genre">'+esc(p[K.genre]||'')+'</span></div>'+
      '<div class="cbody"><h3>'+esc(title)+'</h3><span class="company">'+esc(p[K.company]||'')+' · '+esc(gradeOf(p,K))+'</span>'+
      ptag+cl+'</div></article>';
  }
  var pagesHtml='';
  for(var i=0;i<ordered.length;i+=6){
    pagesHtml+='<div class="page">'+ordered.slice(i,i+6).map(cardHTML).join('')+'</div>';
  }
  var pagesEl=$('#pages');
  pagesEl.innerHTML=pagesHtml;
  pagesEl.scrollLeft=0;

  renderTable(sortKey,sortDir);

  var srows='', lastG='';
  skills.forEach(function(s){
    if(s['group']&&s['group']!==lastG){ lastG=s['group']; srows+='<tr class="grp"><td colspan="4">'+esc(s['group'])+'</td></tr>'; }
    if(!s['skill']) return;
    var pips='<span class="pips">'+[1,2,3,4,5].map(function(x){return '<i class="'+(x<=+s['level']?'f':'')+'"></i>';}).join('')+'</span>';
    srows+='<tr id="skill-'+slug(s['skill'])+'"><td class="left pn">'+esc(s['skill'])+'</td><td>'+pips+'</td><td>'+esc(s['experience']||'')+'</td><td class="left case">'+caseChips(s['cases'])+'</td></tr>';
  });
  $('#skillsTable').innerHTML='<table><thead><tr><th class="left">'+esc(T.skill)+'</th><th>'+esc(T.level)+'</th><th>'+esc(T.experience)+'</th><th class="left">'+esc(T.cases)+'</th></tr></thead><tbody>'+srows+'</tbody></table>';

  $('#expList').innerHTML=exp.map(function(e){
    var term=(e['period']||'')+((e['срок']||e['duration'])? ' · '+(e['срок']||e['duration']):'');
    var role=((e['grade']||'')+' '+(e['role']||'')).trim()+' · '+(e['project']||'');
    return '<div class="tl"><div class="tl-dot"></div><div class="tl-head"><h3>'+esc(e['company'])+'</h3></div><span class="tl-date">'+esc(term)+'</span><p class="tl-role">'+esc(role)+'</p><p class="res">'+esc(e['result'])+'</p></div>';
  }).join('');

  $('#eduList').innerHTML=edu.map(function(e){
    return '<div class="ecard"><span class="yr">'+esc(e['year'])+'</span><h3>'+esc(e['title'])+'</h3><p>'+esc(e['note'])+'</p></div>';
  }).join('');

  $('#fContacts').innerHTML=contacts.map(function(c){
    return '<a href="'+esc(c['value'])+'" target="_blank" rel="noopener">'+esc(c['label'])+'</a>';
  }).join('');
  $('#fCopy').innerHTML='<span>'+esc(footer['copy']||'')+'</span><span>'+esc(footer['geo']||'')+'</span>';

  fitLines();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitLines); }
}

/* i18n: ?lang=en → localStorage → ru; базовый URL не меняется */
function initialLang(){
  try{
    var q=new URLSearchParams(location.search).get('lang');
    if(q==='en') return 'en';
    if(q==='ru') return 'ru';
  }catch(e){}
  var s=lsGet('sarvasLang');
  return s==='en'?'en':'ru';
}
function applyLang(lang){
  lsSet('sarvasLang',lang);
  try{
    var url=new URL(location.href);
    if(lang==='en') url.searchParams.set('lang','en'); else url.searchParams.delete('lang');
    history.replaceState(null,'',url.toString());
  }catch(e){}
  render(lang);
}

function fitLines(){
  var brand=$('#hBrand'); if(!brand) return;
  var target=brand.getBoundingClientRect().width;
  ['#hName','#hRole'].forEach(function(sel){
    var el=$(sel); if(!el || !el.textContent) return;
    el.style.letterSpacing='0px';
    var w=el.getBoundingClientRect().width;
    var len=el.textContent.length;
    if(len>1 && w>0 && target>w){
      var ls=(target-w)/(len-1);
      ls=Math.max(0,Math.min(ls,18));
      el.style.letterSpacing=ls.toFixed(2)+'px';
    }
  });
}
var rzT;
window.addEventListener('resize',function(){ clearTimeout(rzT); rzT=setTimeout(fitLines,150); });

function initPages(){
  var el=$('#pages'); if(!el) return;
  function step(){ return el.clientWidth; }
  var nx=$('#slNext'), pv=$('#slPrev');
  if(nx) nx.addEventListener('click',function(){
    var max=el.scrollWidth-el.clientWidth;
    el.scrollTo({left:(el.scrollLeft>=max-8)?0:el.scrollLeft+step(),behavior:RM?'auto':'smooth'});
  });
  if(pv) pv.addEventListener('click',function(){
    var max=el.scrollWidth-el.clientWidth;
    el.scrollTo({left:(el.scrollLeft<=8)?max:el.scrollLeft-step(),behavior:RM?'auto':'smooth'});
  });
}
function initViews(){
  var v=lsGet('sarvasView')||'show';
  function set(x){
    document.body.dataset.view=x; lsSet('sarvasView',x);
    var a=$('#vShow'), b=$('#vTable');
    if(a) a.classList.toggle('active',x==='show');
    if(b) b.classList.toggle('active',x==='table');
  }
  var a=$('#vShow'), b=$('#vTable');
  if(a) a.addEventListener('click',function(){set('show');});
  if(b) b.addEventListener('click',function(){set('table');});
  set(v);
}
function initSort(){
  var el=$('#projTable'); if(!el) return;
  el.addEventListener('click',function(e){
    var th=e.target.closest('th[data-key]');
    if(!th) return;
    var key=th.dataset.key;
    var dir=th.classList.contains('desc')?1:-1;
    renderTable(key,dir);
  });
}
function initFlash(){
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#skill-"]');
    if(!a) return;
    var t=document.querySelector(a.getAttribute('href'));
    if(t){ t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  });
}
function initTop(){
  var b=$('#scrollToTop'); if(!b) return;
  window.addEventListener('scroll',function(){
    b.style.display=window.scrollY>300?'block':'none';
  });
  b.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
  });
}
function runCount(el){
  if(el.dataset.done) return; el.dataset.done='1';
  var raw=el.dataset.to, m=raw.match(/^([\d.]+)(\+?)$/), to=m?parseFloat(m[1]):0, suf=m?m[2]:'';
  if(RM||!m){ el.textContent=raw; return; }
  var t0=performance.now();
  (function step(t){
    var p=Math.min(1,(t-t0)/1300), e=1-Math.pow(1-p,3);
    el.textContent=(to%1?(to*e).toFixed(1):Math.round(to*e))+(p===1?suf:'');
    if(p<1) requestAnimationFrame(step);
  })(t0);
}
function initAnim(){
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.add('on');
      e.target.querySelectorAll('[data-to]').forEach(runCount);
      io.unobserve(e.target);
    });
  },{threshold:.18});
  $$('.reveal').forEach(function(el){ io.observe(el); });
}

initPages(); initViews(); initSort(); initFlash(); initTop(); initAnim();
$('#langBtn').addEventListener('click',function(){ applyLang(CUR==='ru'?'en':'ru'); });

var START_LANG=initialLang();
fetch('content.md?v='+Date.now())
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(function(t){
    try{
      DATA=parseMD(t);
      applyLang(START_LANG);
    }
    catch(err){ var e=$('#err'); if(e){ e.style.display='block'; e.appendChild(document.createTextNode(' Render error: '+err.message)); } if(window.console) console.error(err); }
  })
  .catch(function(err){ var e=$('#err'); if(e){ e.style.display='block'; e.innerHTML=esc(I18N[START_LANG].err)+' <a href="https://tinyurl.com/Portfolio-SarvasGD">tinyurl.com/Portfolio-SarvasGD</a>'; e.appendChild(document.createTextNode(' '+(err&&err.message?err.message:err))); } });
})();
</script>
