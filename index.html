<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARVAS – Game Designer</title>
<meta name="description" content="Portfolio of game designer Vasily Sarmanaev (SARVAS). Game systems, meta-game, balance, UX/UI, documentation and prototypes – from concept to release.">
<link rel="icon" type="image/png" href="covers/logo.png">
<meta name="theme-color" content="#0c0a0e">
<style>
/* ----- RESET & VARIABLES ----- */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0a0e; --bg2:#120d16; --panel:#17111c; --panel2:#1d1524;
  --line:#2b2132; --line2:#3a2c44;
  --red:#d81a3a; --red2:#8e0f24; --red3:#ff3b5c;
  --text:#f4eef2; --muted:#9d92a4; --dim:#6d6377; --th:#cfc4da;
  --disp:'Russo One',sans-serif; --body:'Manrope',sans-serif;
}
html{scroll-padding-top:84px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:var(--red3);text-decoration:none}
img{display:block;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
section{padding:72px 0;content-visibility:auto}
h2{font-family:var(--disp);font-size:clamp(26px,3.6vw,40px);letter-spacing:.03em;margin-bottom:26px;display:flex;align-items:baseline;gap:18px}
h2 .idx{font-size:.55em;color:var(--red);letter-spacing:.1em}
.hrow{display:flex;align-items:baseline;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.hrow h2{margin-bottom:0}
.dim{color:var(--dim)}
#err{display:none;margin:14px auto;max-width:1240px;padding:14px 18px;border:1px solid var(--red3);color:var(--red3);font-weight:600;background:rgba(216,26,58,.08)}
#err a{color:var(--red3);text-decoration:underline}
/* ----- NAV ----- */
.nav{position:sticky;top:0;z-index:50;background:rgba(12,10,14,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:grid;place-items:center;margin-right:auto}
.logo img{height:56px;width:auto;grid-area:1/1}
.logo .logo-text{display:none;grid-area:1/1;font-family:'Imperial','Russo One',sans-serif;font-size:26px;letter-spacing:.08em;color:var(--text);border-left:3px solid var(--red);padding-left:12px;line-height:1}
.logo .logo-text small{display:block;font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.42em;color:var(--red3);margin-top:3px}
.logo img.img-missing{display:none}
.logo img.img-missing+.logo-text{display:block}
.nav nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;align-items:center}
.nav nav::-webkit-scrollbar{display:none}
.nav nav a{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:color .2s}
.nav nav a:hover{color:var(--red3)}
#langBtn{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--muted);background:var(--panel);border:1px solid var(--line2);padding:6px 10px;cursor:pointer}
#langBtn:hover{color:var(--red3);border-color:rgba(255,59,92,.5)}
/* ----- HERO ----- */
.hero{padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:400px 1fr;gap:56px;align-items:stretch}
.frame{position:relative;padding:16px;height:100%}
.frame i{position:absolute;width:26px;height:26px;border:2px solid var(--red)}
.frame i.c1{top:0;left:0;border-right:0;border-bottom:0}
.frame i.c2{top:0;right:0;border-left:0;border-bottom:0}
.frame i.c3{bottom:0;left:0;border-right:0;border-top:0}
.frame i.c4{bottom:0;right:0;border-left:0;border-top:0}
.photo{position:relative;overflow:hidden;background:var(--panel);height:100%;box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(15%) contrast(1.06);animation:breathe 16s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
.photo .ph-fb{position:absolute;inset:0;display:grid;place-items:center;font-family:'Imperial','Russo One',sans-serif;font-size:64px;color:var(--red2)}
.photo img.img-missing{display:none;animation:none}
.photo::after{content:'';position:absolute;top:0;bottom:0;left:-45%;width:45%;pointer-events:none;background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.05) 35%,rgba(255,255,255,.12) 50%,rgba(255,59,92,.08) 62%,transparent 100%);filter:blur(14px);mix-blend-mode:screen;animation:glare 9s linear infinite}
@keyframes glare{from{transform:translateX(0)}to{transform:translateX(320%)}}
.lockup-svg{width:min(640px,100%);height:auto;display:block;overflow:visible}
.lk-brand{font-family:'Imperial','Russo One',sans-serif;font-size:84px;fill:var(--text)}
.lk-name{font-family:var(--disp);font-size:36px;fill:var(--text)}
.lk-role{font-family:'Montserrat',var(--disp);font-size:26px;font-weight:600;fill:var(--red3)}
.hlead{max-width:640px;color:var(--muted);font-size:17px;margin-top:18px}
.stats{margin:30px 0 6px;display:grid;gap:16px;max-width:640px}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end}
.stat .lb{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .num{font-family:var(--disp);font-size:26px;color:var(--red3);line-height:1}
.stat .num em{font-style:normal;font-size:14px;color:var(--dim)}
.bar{grid-column:1/-1;height:6px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--red2),var(--red) 70%,var(--red3));transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
.on .bar .fill{width:var(--w)}
/* ----- TICKER ----- */
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--bg2)}
.ticker-track{display:flex;width:max-content;animation:tick 30s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker a{padding:13px 20px;font-family:var(--disp);font-size:12px;letter-spacing:.24em;color:var(--muted);white-space:nowrap;transition:color .2s}
.ticker a:hover{color:var(--red3)}
.ticker b{color:var(--red);font-weight:400}
@keyframes tick{to{transform:translateX(-50%)}}
/* ----- SHOWCASE & TABLE ----- */
.pages-wrap{position:relative;padding:0 64px}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{min-width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;scroll-snap-align:start;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);position:relative;display:flex;flex-direction:column;transition:transform .35s,border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-7px);border-color:var(--red2);box-shadow:0 22px 50px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;top:-1px;left:-1px;width:22px;height:22px;border-top:2px solid var(--red);border-left:2px solid var(--red);z-index:2;transition:width .3s,height .3s}
.card:hover::before{width:44px;height:44px}
.cover{position:relative;overflow:hidden;aspect-ratio:16/9;background:var(--panel2)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1);filter:saturate(.92)}
.card:hover .cover img{transform:scale(1.07)}
.cover-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:4px;background:linear-gradient(150deg,var(--panel2) 0%,var(--red2) 140%),repeating-linear-gradient(-45deg,transparent 0 14px,rgba(216,26,58,.07) 14px 15px)}
.cover-ph b{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--text)}
.cover-ph span{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--red3)}
.st{position:absolute;top:12px;right:12px;padding:5px 12px;font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;background:rgba(12,10,14,.82);border:1px solid;z-index:2}
.genre{position:absolute;bottom:12px;left:12px;padding:5px 12px;font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(12,10,14,.82);border:1px solid rgba(244,238,242,.4);color:var(--text);z-index:2}
.cbody{padding:22px 22px 24px;flex:1;display:flex;flex-direction:column}
.cbody h3{font-family:var(--disp);font-size:19px;letter-spacing:.03em;margin-bottom:8px}
.cbody .company{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.cbody p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.clink{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:auto}
.clink:hover{text-shadow:0 0 14px rgba(255,59,92,.6)}
.sl-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:52px;height:52px;background:transparent;border:none;color:var(--text);cursor:pointer;display:grid;place-items:center;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));opacity:.85;transition:opacity .2s,color .2s}
.sl-btn:hover{opacity:1;color:var(--red3)}
.sl-btn.prev{left:4px}
.sl-btn.next{right:4px}
.sl-btn svg{width:34px;height:34px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel);margin-bottom:26px}
.fullbleed{width:calc(100vw - 48px);margin:0 auto}
table{width:100%;border-collapse:collapse;min-width:1080px;font-size:14px}
table.wide{min-width:1600px}
th{font-family:var(--disp);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--th);text-align:center;padding:14px 10px;border-bottom:1px solid var(--line2);background:var(--bg2);white-space:nowrap}
td{padding:13px 10px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle;text-align:center}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(216,26,58,.06)}
#projTable th[data-key]{cursor:pointer;user-select:none}
#projTable th[data-key]::after{content:'↕';margin-left:8px;opacity:.35;font-family:var(--body)}
#projTable th[data-key].asc::after{content:'↑';opacity:1;color:var(--red3)}
#projTable th[data-key].desc::after{content:'↓';opacity:1;color:var(--red3)}
td.proj{text-align:center}
.pn{color:var(--text);font-weight:800;font-size:15px;display:block}
.pn a{color:var(--text);transition:color .2s}
.pn a:hover{color:var(--red3)}
.comp{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red3);opacity:.8;margin-top:4px}
a.comp:hover{opacity:1;text-decoration:underline}
.meta{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
.badge{display:inline-block;padding:4px 10px;font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid;background:rgba(12,10,14,.5);margin-top:6px;text-wrap:balance}
.td-period .td-role{display:block;margin-bottom:6px}
.td-period .g,.td-period .r{color:var(--text);font-weight:600}
.td-period .p-line{display:block;white-space:nowrap}
.td-period .dim{display:block;margin-top:3px}
td.res-cell{font-size:12.5px;max-width:280px;vertical-align:top}
td.res-empty{vertical-align:middle}
.cellink{display:inline-block;font-size:12.5px;font-weight:600;border:1px solid var(--line2);padding:4px 10px;color:var(--muted)}
a.cellink:hover{color:var(--red3);border-color:rgba(255,59,92,.5)}
.rl-pct{text-align:center;font-family:var(--disp);font-weight:800;font-size:15px;color:var(--red3);margin:2px 0 6px}
.rl-chip{text-align:center;margin:2px 0 8px}
.rl-compact{text-align:left;font-size:12.5px;color:var(--text);font-weight:600;margin:2px 0}
.rl-compact.res-b{font-weight:800}
.rl-li{text-align:left;font-size:12.5px;color:var(--muted);margin:2px 0}
.rl-dash{text-align:center;color:var(--dim)}
/* Skills */
td.sk-name{text-align:left;color:var(--text);font-weight:700}
tr.grp td{background:var(--bg2);color:var(--red3);font-family:var(--disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;text-align:left;cursor:default}
.pips{display:inline-flex;gap:5px;justify-content:center}
.pips i{width:14px;height:6px;background:var(--line2);transform:skewX(-16deg)}
.pips i.f{background:linear-gradient(90deg,var(--red2),var(--red3))}
td.case a,td.case .casechip{display:inline-block;margin:0 6px 6px 0;font-size:12.5px;font-weight:600;border:1px solid var(--line2);padding:4px 10px;color:var(--muted)}
td.case a:hover{color:var(--red3);border-color:rgba(255,59,92,.5)}
tr.flash{animation:flash 1.2s ease}
@keyframes flash{0%,60%{background:rgba(216,26,58,.22)}100%{background:transparent}}
body[data-view="table"] .show-wrap{display:none}
body[data-view="show"] .tbl-projects{display:none}
/* ----- TIMELINE ----- */
.tl-list{position:relative;padding-left:34px;max-width:860px}
.tl-list::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--red),var(--red2) 60%,transparent)}
.tl{position:relative;padding-bottom:38px}
.tl:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-32px;top:6px;width:14px;height:14px;background:var(--bg);border:3px solid var(--red);transform:rotate(45deg)}
.tl-head h3{font-family:var(--disp);font-size:19px;letter-spacing:.04em}
.tl-date{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:4px 0}
.tl-role{color:var(--red3);font-weight:600;font-size:14px;margin:0 0 8px}
.tl p.res{color:var(--muted);font-size:14.5px}
/* ----- EDUCATION ----- */
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
@media (min-width:1100px){.edu{grid-template-columns:repeat(5,1fr)}}
.ecard{border:1px solid var(--line);background:var(--panel);padding:22px;transition:border-color .3s;display:flex;flex-direction:column}
.ecard:hover{border-color:var(--red2)}
.ecard .yr{display:inline-block;align-self:flex-start;font-family:var(--disp);color:var(--red3);font-size:12px;letter-spacing:.14em;border:1px solid rgba(255,59,92,.4);padding:2px 8px;margin-bottom:10px}
.ecard h3{font-size:15px;margin:0 0 6px}
.ecard p{color:var(--muted);font-size:13px}
/* ----- FOOTER ----- */
footer{border-top:1px solid var(--line);background:var(--bg2);padding:64px 0 40px}
.fgrid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.fbig{line-height:1}
.flogo{height:clamp(80px,12vw,140px);width:auto;max-width:100%}
.fbig-text{display:none;font-family:'Imperial','Russo One',sans-serif;font-size:clamp(40px,7vw,84px);line-height:1;color:var(--text);text-shadow:0 0 40px rgba(216,26,58,.3);letter-spacing:.06em}
.fbig-text small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.5em;color:var(--red3);margin-top:8px}
.flogo.img-missing{display:none}
.flogo.img-missing+.fbig-text{display:block}
.fcontacts{display:grid;gap:12px;text-align:right}
.fcontacts a{color:var(--muted);font-weight:600;transition:color .2s}
.fcontacts a:hover{color:var(--red3)}
.copy{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;letter-spacing:.06em}
#scrollToTop{position:fixed;bottom:20px;right:20px;width:44px;height:44px;background:var(--red);border:none;border-radius:50%;color:var(--text);font-size:20px;cursor:pointer;display:none;z-index:100;box-shadow:0 8px 24px rgba(216,26,58,.4)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.on{opacity:1;transform:none}
/* View switch */
.vmode{margin-left:auto;display:flex;gap:8px}
.vmode button{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line2);padding:8px 14px;cursor:pointer;transition:color .2s,border-color .2s}
.vmode button.active{color:var(--red3);border-color:rgba(255,59,92,.5)}
/* ----- ADAPTIVE ----- */
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;gap:40px}
  .frame{max-width:400px;height:auto}
  .photo img{aspect-ratio:4/5;height:auto}
  .page{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .fcontacts{text-align:left}
  .pages-wrap{padding:0;margin-bottom:76px}
  .sl-btn{top:auto;transform:none;bottom:-70px}
  .sl-btn.prev{left:calc(50% - 56px)}
  .sl-btn.next{right:calc(50% - 56px)}
  .fullbleed{width:calc(100vw - 32px)}
}
@media (max-width:640px){.page{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .bar .fill{width:var(--w)}
}
/* ----- FONTS ----- */
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/russo-one@latest/cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/russo-one@latest/latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-600-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-600-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/cyrillic-600-normal.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-600-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+FEFF,U+FFFD}
@import url('https://fonts.cdnfonts.com/css/imperial');
</style>
</head>
<body data-view="show">

<div id="err" class="wrap">Не удалось загрузить данные.</div>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="SARVAS GAME DESIGN">
      <img data-role="logo" src="covers/logo.png" alt="SARVAS GAME DESIGN – логотип" onerror="this.classList.add('img-missing')">
      <span class="logo-text">SARVAS<small>GAME DESIGN</small></span>
    </a>
    <nav id="nav" aria-label="Основная навигация"></nav>
    <button id="langBtn" aria-label="Переключить язык">EN</button>
  </div>
</header>

<main id="top">
  <section class="hero reveal" id="hero" aria-labelledby="hName">
    <div class="wrap">
      <div class="frame">
        <i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i>
        <div class="photo">
          <span class="ph-fb">SV</span>
          <img data-role="photo" src="covers/photo.jpg" alt="Фото Василя Сарманаева – гейм-дизайнера SARVAS" onerror="this.classList.add('img-missing')">
        </div>
      </div>
      <div>
        <h1 class="sr-only" id="hName"></h1>
        <div id="lockup"></div>
        <p class="hlead" id="hTag"></p>
        <div class="stats" id="hStats"></div>
      </div>
    </div>
  </section>

  <div class="ticker"><div class="ticker-track" id="ticker"></div></div>

  <section id="projects" aria-labelledby="tProjects">
    <div class="wrap">
      <div class="hrow">
        <h2 class="reveal"><span class="idx">01</span><span id="tProjects">Проекты</span></h2>
        <div class="vmode reveal">
          <button id="vShow" class="active" aria-label="Показать проекты в виде витрины">Витрина</button>
          <button id="vTable" aria-label="Показать проекты и результаты в виде таблицы">Результаты</button>
        </div>
      </div>
      <div class="show-wrap reveal" id="gallery">
        <div class="pages-wrap">
          <div class="pages" id="pages"></div>
          <button class="sl-btn prev" id="slPrev" aria-label="Предыдущая страница проектов"><svg viewBox="0 0 24 24"><polyline points="16 5 9 12 16 19"/><polyline points="11 8 7.5 12 11 16"/></svg></button>
          <button class="sl-btn next" id="slNext" aria-label="Следующая страница проектов"><svg viewBox="0 0 24 24"><polyline points="8 5 15 12 8 19"/><polyline points="13 8 16.5 12 13 16"/></svg></button>
        </div>
      </div>
    </div>
    <div id="projTable" class="tbl-wrap tbl-projects fullbleed reveal"></div>
  </section>

  <section id="skills" aria-labelledby="tSkills">
    <div class="wrap">
      <h2 class="reveal"><span class="idx">02</span><span id="tSkills">Навыки и кейсы</span></h2>
      <div class="tbl-wrap reveal" id="skillsTable"></div>
    </div>
  </section>

  <section id="exp" aria-labelledby="tExp">
    <div class="wrap">
      <h2 class="reveal"><span class="idx">03</span><span id="tExp">Опыт</span></h2>
      <div class="tl-list reveal" id="expList"></div>
    </div>
  </section>

  <section id="edu" aria-labelledby="tEdu">
    <div class="wrap">
      <h2 class="reveal"><span class="idx">04</span><span id="tEdu">Образование</span></h2>
      <div class="edu reveal" id="eduList"></div>
    </div>
  </section>
</main>

<footer id="contacts" aria-label="Контакты и информация">
  <div class="wrap">
    <div class="fgrid">
      <div class="fbig reveal">
        <img class="flogo" data-role="logo" src="covers/logo.png" alt="SARVAS GAME DESIGN – логотип" onerror="this.classList.add('img-missing')">
        <span class="fbig-text">SARVAS<small>GAME DESIGN</small></span>
      </div>
      <div class="fcontacts reveal" id="fContacts"></div>
    </div>
    <div class="copy" id="fCopy"></div>
  </div>
</footer>

<button id="scrollToTop" aria-label="Вернуться в начало страницы">↑</button>

<script>
(function(){
'use strict';

/* ---- SECTION MAP ---- */
const SECTION_MAP = {
  ru: {
    hero: 'Hero',
    metrics: 'Метрики',
    showcase: 'Порядок витрины',
    projects: 'Проекты',
    results: 'Проекты-Результаты',
    images: 'Изображения',
    skills: 'Навыки и кейсы',
    experience: 'Опыт',
    education: 'Образование',
    contacts: 'Контакты',
    statuses: 'Статусы',
    footer: 'Футер'
  },
  en: {
    hero: 'Hero EN',
    metrics: 'Metrics EN',
    showcase: 'Project Showcase Order EN',
    projects: 'Projects EN',
    results: 'Projects-Results EN',
    images: 'Images EN',
    skills: 'Skills and Cases EN',
    experience: 'Experience EN',
    education: 'Education EN',
    contacts: 'Contacts EN',
    statuses: 'Statuses EN',
    footer: 'Footer EN'
  }
};

/* ---- HELPERS ---- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } };
const parseLinks = cell => {
  const out = [];
  const re = /\[([^\]]+)\]\(([^)]+)\)/g;
  let m;
  while((m = re.exec(cell||''))) out.push({label:m[1], url:m[2]});
  return out;
};
const splitRow = line => line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());
const isSep = cells => cells.every(c => /^:?-{2,}:?$/.test(c));

/* ---- STATE ---- */
let lang = (new URLSearchParams(location.search).get('lang')) || localStorage.getItem('sarvasLang') || 'ru';
let sections = {};
let STATUS = {};
let projects = [];
let images = [];
let results = {};
let skills = [];
let experience = [];
let education = [];
let contacts = [];
let footer = {};
let hero = {};
let metrics = [];
let showcaseOrder = [];

/* ---- PARSE MARKDOWN ---- */
function parseMarkdown(text) {
  const lines = text.split(/\r?\n/);
  const secs = {};
  let cur = null;
  let inTable = false;
  let rawRows = [];

  function finalizeTable() {
    if (!cur) return;
    if (rawRows.length === 0) return;
    const header = rawRows[0];
    let startIdx = 1;
    if (rawRows.length > 1 && rawRows[1].every(c => /^:?-{2,}:?$/.test(c))) {
      startIdx = 2;
    }
    const dataRows = rawRows.slice(startIdx);
    cur.rows = dataRows.map(row => {
      const obj = {};
      header.forEach((h, i) => {
        obj[h.toLowerCase()] = row[i] || '';
      });
      return obj;
    });
    cur.header = header;
    rawRows = [];
    inTable = false;
  }

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();
    if (!line) continue;

    if (/^#{1,2}\s+/.test(line)) {
      if (inTable) finalizeTable();
      const name = line.replace(/^#+\s*/, '').trim();
      cur = { name, lines: [], rows: [], header: null };
      secs[name] = cur;
      inTable = false;
      rawRows = [];
      continue;
    }

    if (!cur) continue;

    if (line.startsWith('|') && line.endsWith('|')) {
      const cells = splitRow(line);
      if (isSep(cells)) continue;
      if (!inTable) {
        inTable = true;
        rawRows = [];
      }
      rawRows.push(cells);
      continue;
    }

    // plain text
    if (inTable) {
      finalizeTable();
    }
    cur.lines.push(line);
  }
  if (inTable) finalizeTable();
  return secs;
}

/* ---- GET SECTION ---- */
function getSection(key) {
  const name = SECTION_MAP[lang] && SECTION_MAP[lang][key];
  if (!name) return null;
  return sections[name] || null;
}

function getSectionRows(key) {
  const s = getSection(key);
  return s && s.rows ? s.rows : [];
}

function getSectionLines(key) {
  const s = getSection(key);
  return s && s.lines ? s.lines : [];
}

function getSectionKV(key) {
  const rows = getSectionRows(key);
  const obj = {};
  rows.forEach(r => {
    const keys = Object.keys(r);
    if (keys.length >= 2) {
      obj[String(r[keys[0]]).toLowerCase().trim()] = r[keys[1]];
    }
  });
  return obj;
}

/* ---- LOAD DATA ---- */
function loadData() {
  return fetch('content.md')
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(text => {
      sections = parseMarkdown(text);
      // populate state
      hero = getSectionKV('hero');
      metrics = getSectionRows('metrics');
      showcaseOrder = getSectionLines('showcase').join(' ').match(/\d+/g) || [];
      projects = getSectionRows('projects');
      images = getSectionRows('images');
      const statuses = getSectionRows('statuses');
      statuses.forEach(s => { if (s['статус'] && s['цвет']) STATUS[s['статус']] = s['цвет']; });
      const resRows = getSectionRows('results');
      resRows.forEach(r => { if (r['проект']) results[norm(r['проект'])] = r; });
      skills = getSectionRows('skills');
      experience = getSectionRows('experience');
      education = getSectionRows('education');
      contacts = getSectionRows('contacts');
      footer = getSectionKV('footer');
    });
}

/* ---- RENDER FUNCTIONS ---- */
function renderHero() {
  const name = hero['nameview'] || hero['name'] || '';
  const brand = hero['brand'] || 'SARVAS';
  const role = (hero['role'] || '').toUpperCase();
  const tagline = hero['tagline'] || '';
  const photo = hero['photo'] || 'covers/photo.jpg';
  const logo = hero['logo'] || 'covers/logo.png';

  document.title = hero['title'] || 'SARVAS';
  $('#hName').textContent = name;

  // lockup SVG
  const lockup = `
    <svg class="lockup-svg" viewBox="0 0 640 190" role="img" aria-label="${esc(brand+' – '+name+' – '+role)}" overflow="visible">
      <text id="lkB" x="0" y="84" class="lk-brand">${esc(brand)}</text>
      <text id="lkN" x="0" y="136" class="lk-name">${esc(name)}</text>
      <text id="lkR" x="0" y="178" class="lk-role">${esc(role)}</text>
    </svg>
  `;
  $('#lockup').innerHTML = lockup;
  fitLockup();

  $('#hTag').textContent = tagline;

  // metrics
  let html = '';
  metrics.forEach(m => {
    const val = parseFloat(m['value']) || 0;
    const max = parseFloat(m['max']) || 0;
    const w = max > 0 ? Math.round(val/max*100) : (parseFloat(m['progress']) || 0);
    html += `
      <div class="stat">
        <span class="lb">${esc(m['label'])}</span>
        <span class="num"><span data-to="${esc(m['value'])}">0</span> <em>${esc(m['unit'])}</em></span>
        <div class="bar"><div class="fill" style="--w:${w}%"></div></div>
      </div>
    `;
  });
  $('#hStats').innerHTML = html;

  // logo & photo
  $$('img[data-role="logo"]').forEach(img => { img.src = logo; });
  $$('img[data-role="photo"]').forEach(img => { img.src = photo; });
}

function fitLockup() {
  const b = $('#lkB');
  if (!b || !b.getComputedTextLength) return;
  const n = $('#lkN');
  const r = $('#lkR');
  b.removeAttribute('textLength');
  if (n) n.removeAttribute('textLength');
  if (r) r.removeAttribute('textLength');
  const wb = b.getComputedTextLength() || 0;
  const wn = n ? (n.getComputedTextLength() || 0) : 0;
  const wr = r ? (r.getComputedTextLength() || 0) : 0;
  const target = Math.max(wb, wn, wr);
  if (target <= 0) return;
  [[n,wn],[r,wr]].forEach(pair => {
    const t = pair[0];
    const w = pair[1];
    if (t && w > 0 && w < target - 1) {
      t.setAttribute('textLength', target);
      t.setAttribute('lengthAdjust', 'spacing');
    }
  });
}
let lkT;
window.addEventListener('resize', ()=>{ clearTimeout(lkT); lkT=setTimeout(fitLockup,150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLockup);

function renderNav() {
  const names = {
    projects: getSection('projects') ? getSection('projects').name : 'Проекты',
    skills: getSection('skills') ? getSection('skills').name : 'Навыки и кейсы',
    experience: getSection('experience') ? getSection('experience').name : 'Опыт',
    education: getSection('education') ? getSection('education').name : 'Образование',
    contacts: getSection('contacts') ? getSection('contacts').name : 'Контакты'
  };
  $('#nav').innerHTML = `
    <a href="#projects">${esc(names.projects)}</a>
    <a href="#skills">${esc(names.skills)}</a>
    <a href="#exp">${esc(names.experience)}</a>
    <a href="#edu">${esc(names.education)}</a>
    <a href="#contacts">${esc(names.contacts)}</a>
  `;
  // update section titles
  $('#tProjects').textContent = names.projects;
  $('#tSkills').textContent = names.skills;
  $('#tExp').textContent = names.experience;
  $('#tEdu').textContent = names.education;
}

function renderTicker() {
  const items = skills.filter(s => s['skill']).map(s =>
    `<a href="#skill-${slug(s['skill'])}">${esc(s['skill'])} <b>◆</b></a>`
  ).join('');
  $('#ticker').innerHTML = items + items;
}

function renderShowcase() {
  // order
  const ordered = [];
  showcaseOrder.forEach(n => {
    const p = projects.find(x => +x['№'] === +n);
    if (p && !ordered.includes(p)) ordered.push(p);
  });
  projects.forEach(p => { if (!ordered.includes(p)) ordered.push(p); });

  const imagesMap = {};
  images.forEach(img => {
    const key = norm(img['проект']);
    imagesMap[key] = img['изображение'] || '';
  });

  function statusColor(st) {
    const s = String(st||'');
    if (STATUS[s]) return STATUS[s];
    const low = s.toLowerCase();
    for (const k in STATUS) {
      if (low.indexOf(k.toLowerCase()) !== -1) return STATUS[k];
    }
    return '#8a8090';
  }

  function cardHTML(p) {
    const title = p['проект'] || '';
    const genre = p['жанр'] || '';
    const platform = p['платформа'] || '';
    const company = p['компания'] || '';
    const status = p['статус'] || '';
    const grade = (p['должность'] || '').split(',')[0].trim();
    const link = p['ссылка на проект'] && p['ссылка на проект'] !== '–' ? p['ссылка на проект'] : null;
    const imgUrl = imagesMap[norm(title)] || '';
    const res = getResultSummary(title);

    let cover = '';
    if (imgUrl) {
      cover = `<img src="${esc(imgUrl)}" alt="Обложка: ${esc(title)}" loading="lazy" decoding="async" onerror="this.style.display='none'">`;
    } else {
      cover = `<div class="cover-ph"><span>${esc(genre)} · ${esc(platform)}</span><b>${esc(title)}</b></div>`;
    }
    const cl = link ? `<a class="clink" href="${esc(link)}" target="_blank" rel="noopener">${esc(host(link))} →</a>` : `<a class="clink" href="#contacts">по запросу →</a>`;
    const color = statusColor(status);
    return `
      <article class="card">
        <div class="cover">
          ${cover}
          <span class="genre">${esc(genre)}</span>
          <span class="st" style="color:${color};border-color:${color}80">${esc(status)}</span>
        </div>
        <div class="cbody">
          <h3>${esc(title)}</h3>
          <span class="company">${esc(company)} · ${esc(grade)}</span>
          ${res ? `<p>${esc(res)}</p>` : '<p></p>'}
          ${cl}
        </div>
      </article>
    `;
  }

  let pagesHtml = '';
  for (let i = 0; i < ordered.length; i += 6) {
    pagesHtml += `<div class="page">${ordered.slice(i,i+6).map(cardHTML).join('')}</div>`;
  }
  $('#pages').innerHTML = pagesHtml;
  initGallery();
}

function getResultSummary(title) {
  const r = results[norm(title)];
  if (!r) return '';
  const lines = (r['результат'] || '').split('<br>').map(s=>s.trim()).filter(s=>s);
  for (const line of lines) {
    if (/^\d+(?:[.,]\d+)?\s?%$/.test(line)) continue;
    if (line.indexOf('•') === 0) continue;
    if (parseLinks(line).length) continue;
    if (line !== '–' && line !== '-') return line.replace(/:\s*$/, '');
  }
  return '';
}

function renderTable() {
  // build results map
  const imagesMap = {};
  images.forEach(img => { imagesMap[norm(img['проект'])] = img['изображение'] || ''; });

  const RES_COLS = [
    {key:'продакт-менеджмент', label:'Продакт-менеджмент'},
    {key:'игровые системы', label:'Игровые системы'},
    {key:'мета-игра', alt:'мета-гейм', label:'Мета-игра'},
    {key:'баланс', label:'Баланс'},
    {key:'ux/ui-дизайн', label:'UX/UI-Дизайн'}
  ];

  function splitCell(cell) {
    if (!cell) return [];
    return String(cell).split(/<br\s*\/?>/i).map(s => s.replace(/^⦁\s*/, '• ').trim()).filter(s => s);
  }

  function catPct(cell) {
    const lines = splitCell(cell);
    for (const l of lines) {
      if (/^\d+(?:[.,]\d+)?\s?%$/.test(l)) return parseFloat(l);
    }
    return null;
  }

  function resVal(r, col) {
    if (!r) return '';
    return (r[col.key] || (col.alt ? r[col.alt] : '') || '').trim();
  }

  function richLines(lines, isResult, catName) {
    let out = [];
    lines.forEach(line => {
      if (!line) return;
      if (catName && norm(line) === norm(catName)) return;
      if (/^\d+(?:[.,]\d+)?\s?%$/.test(line)) {
        out.push(`<div class="rl-pct">${esc(line)}</div>`);
        return;
      }
      if (line.indexOf('•') === 0) {
        out.push(`<div class="rl-li">${esc(line)}</div>`);
        return;
      }
      if (line === '–' || line === '-') {
        out.push(`<div class="rl-dash">–</div>`);
        return;
      }
      const links = parseLinks(line);
      if (links.length) {
        let txt = line.replace(/\[([^\]]+)\]\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
        links.forEach(l => {
          let label = l.label;
          if (!/[0-9a-zа-яё]{2,}/i.test(label)) label = catName || 'Артефакт';
          out.push(`<div class="rl-chip"><a class="cellink" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(label)}</a></div>`);
        });
        if (txt) out.push(`<div class="rl-compact${isResult?' res-b':''}">${esc(txt)}</div>`);
        return;
      }
      out.push(`<div class="rl-compact${isResult?' res-b':''}">${esc(line)}</div>`);
    });
    return out.join('');
  }

  function badge(st) {
    const color = STATUS[st] || '#8a8090';
    return `<span class="badge" style="color:${color};border-color:${color}80">${esc(st)}</span>`;
  }

  function gradeOf(p) { return (p['должность'] || '').split(',')[0].trim(); }
  function roleOf(p) { const parts = (p['должность'] || '').split(','); parts.shift(); return parts.join(',').trim(); }

  // sort state
  let sortKey = 'id';
  let sortDir = -1;

  function renderTableData(key, dir) {
    const sorted = projects.slice().sort((a,b) => {
      let va, vb;
      if (key === 'id') { va = +a['№'] || 0; vb = +b['№'] || 0; }
      else if (key === 'title') { va = norm(a['проект']); vb = norm(b['проект']); }
      else if (key === 'period') { va = periodKey(a['период'] || ''); vb = periodKey(b['период'] || ''); }
      else { va = 0; vb = 0; }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });

    let html = '';
    sorted.forEach(p => {
      const r = results[norm(p['проект'])];
      let sum = 0, cnt = 0;
      RES_COLS.forEach(col => {
        const pc = catPct(resVal(r, col));
        if (pc !== null) { sum += pc; cnt++; }
      });
      const resultPct = cnt > 0 ? Math.round(sum / cnt) : null;

      const plink = (p['ссылка на проект'] && p['ссылка на проект'] !== '–') ?
        `<a href="${esc(p['ссылка на проект'])}" target="_blank" rel="noopener">${esc(p['проект'])}</a>` :
        esc(p['проект']);
      const comp = (p['ссылка на компанию'] && p['ссылка на компанию'] !== '–') ?
        `<a class="comp" href="${esc(p['ссылка на компанию'])}" target="_blank" rel="noopener">${esc(p['компания'] || '')}</a>` :
        `<span class="comp">${esc(p['компания'] || '')}</span>`;
      const term2 = (p['срок'] || '') + (p['занятость'] ? ' · ' + p['занятость'] : '');

      const resCols = RES_COLS.map(col => {
        const v = resVal(r, col);
        if (!v || v === '–') return `<td class="res-cell res-empty"><div class="rl-dash">–</div></td>`;
        const lines = splitCell(v);
        return `<td class="res-cell">${richLines(lines, false, col.label)}</td>`;
      }).join('');

      let resCell;
      const rv = r ? (r['результат'] || '') : '';
      const rlines = splitCell(rv).filter(l => !/^\d+(?:[.,]\d+)?\s?%$/.test(l));
      if (!rv || rlines.length === 0) {
        resCell = `<td class="res-cell res-empty"><div class="rl-dash">–</div></td>`;
      } else {
        const head = resultPct !== null ? `<div class="rl-pct">${resultPct}%</div>` : '';
        resCell = `<td class="res-cell res-final">${head}${richLines(rlines, true, 'Результат')}</td>`;
      }

      html += `
        <tr>
          <td class="proj">
            <span class="pn">${plink}</span>
            ${comp}
            <span class="meta">${esc(p['жанр'] || '')} · ${esc(p['платформа'] || '')} · ${esc(p['монетизация'] || '')}</span><br>
            ${badge(p['статус'] || '')}
          </td>
          <td class="td-period">
            <span class="td-role"><span class="g">${esc(gradeOf(p))}</span> <span class="r">${esc(roleOf(p))}</span></span>
            <span class="p-line">${esc(p['период'] || '')}</span>
            <span class="dim">${esc(term2)}</span>
          </td>
          ${resCols}
          ${resCell}
        </tr>
      `;
    });

    function cls(k, extra) {
      return (extra ? extra+' ' : '') + (sortKey === k ? (sortDir < 0 ? 'desc' : 'asc') : '');
    }
    const resHead = RES_COLS.map(col => `<th>${esc(col.label)}</th>`).join('');
    const thead = `
      <thead>
        <tr>
          <th data-key="title" class="${cls('title')}">Проект</th>
          <th data-key="period" class="${cls('period')}">Период · Роль</th>
          ${resHead}
          <th>Результат</th>
        </tr>
      </thead>
    `;
    $('#projTable').innerHTML = `<table class="wide">${thead}<tbody>${html}</tbody></table>`;
  }

  function periodKey(s) {
    const MON = {'янв':1,'фев':2,'мар':3,'апр':4,'май':5,'июн':6,'июл':7,'авг':8,'сен':9,'окт':10,'ноя':11,'дек':12};
    const m = String(s).match(/([a-zа-я]+)[^\d]*(\d{4})/i);
    if (m) { const mm = MON[m[1].toLowerCase()] || 0; return (+m[2]) * 12 + mm; }
    const y = String(s).match(/(\d{4})/);
    return y ? (+y[1]) * 12 : 0;
  }

  // initial render
  renderTableData('id', -1);

  // sort handler
  $('#projTable').addEventListener('click', function(e) {
    const th = e.target.closest('th[data-key]');
    if (!th) return;
    const key = th.dataset.key;
    let dir = -1;
    if (sortKey === key) dir = sortDir > 0 ? -1 : 1;
    else { sortKey = key; dir = -1; }
    sortDir = dir;
    renderTableData(key, dir);
  });
}

function renderSkills() {
  const rows = skills.filter(s => s['skill']);
  let html = '';
  let lastGroup = '';
  rows.forEach(s => {
    if (isEmptySkill(s)) return;
    if (s['group'] && s['group'] !== lastGroup) {
      lastGroup = s['group'];
      html += `<tr class="grp"><td colspan="4">${esc(s['group'])}</td></tr>`;
    }
    const pips = [1,2,3,4,5].map(x => `<i class="${x <= +s['level'] ? 'f' : ''}"></i>`).join('');
    const links = parseLinks(s['cases']);
    let casesHtml;
    if (links.length) {
      casesHtml = links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
    } else {
      const txt = (s['cases'] || '').trim();
      casesHtml = (txt && txt !== '–') ? txt.split(';').map(t => t.trim()).filter(t=>t).map(t => `<span class="casechip">${esc(t)}</span>`).join('') : '–';
    }
    html += `
      <tr id="skill-${slug(s['skill'])}">
        <td class="sk-name">${esc(s['skill'])}</td>
        <td><span class="pips">${pips}</span></td>
        <td>${esc(s['experience'] || '')}</td>
        <td class="case" style="text-align:left">${casesHtml}</td>
      </tr>
    `;
  });
  $('#skillsTable').innerHTML = `
    <table>
      <thead><tr><th style="text-align:left">Навык</th><th>Уровень</th><th>Опыт</th><th style="text-align:left">Кейсы</th></tr></thead>
      <tbody>${html}</tbody>
    </table>
  `;
}

function isEmptySkill(s) {
  const e = (s['experience'] || '').trim();
  const c = (s['cases'] || '').trim();
  return (!e || e === '–') && (!c || c === '–');
}

function renderExperience() {
  let html = '';
  experience.forEach(e => {
    const term = (e['period'] || '') + (e['срок'] ? ' · ' + e['срок'] : '');
    const role = ((e['grade'] || '') + ' ' + (e['role'] || '')).trim() + ' · ' + (e['project'] || '');
    html += `
      <div class="tl">
        <div class="tl-dot"></div>
        <div class="tl-head"><h3>${esc(e['company'])}</h3></div>
        <span class="tl-date">${esc(term)}</span>
        <p class="tl-role">${esc(role)}</p>
        <p class="res">${esc(e['result'] || '')}</p>
      </div>
    `;
  });
  $('#expList').innerHTML = html;
}

function renderEducation() {
  const edu = getSectionRows('education');
  let html = '';
  edu.slice().reverse().forEach(e => {
    html += `
      <div class="ecard">
        <span class="yr">${esc(e['year'])}</span>
        <h3>${esc(e['title'])}</h3>
        <p>${esc(e['note'])}</p>
      </div>
    `;
  });
  $('#eduList').innerHTML = html;
}

function renderContacts() {
  let html = '';
  contacts.forEach(c => {
    html += `<a href="${esc(c['value'])}" target="_blank" rel="noopener">${esc(c['label'])}</a>`;
  });
  $('#fContacts').innerHTML = html;
}

function renderFooter() {
  $('#fCopy').innerHTML = `<span>${esc(footer['copy'] || '')}</span><span>${esc(footer['geo'] || '')}</span>`;
}

/* ---- GALLERY PAGINATION ---- */
function initGallery() {
  const el = $('#pages');
  if (!el) return;
  const pages = Array.from(el.children);
  if (pages.length < 2) { bindArrows(el); return; }
  const N = pages.length;
  const cloneL = pages[N-1].cloneNode(true);
  const cloneF = pages[0].cloneNode(true);
  el.insertBefore(cloneL, pages[0]);
  el.appendChild(cloneF);
  function pageW() { return el.clientWidth; }
  el.scrollLeft = pageW();
  let t;
  el.addEventListener('scroll', function() {
    clearTimeout(t);
    t = setTimeout(function() {
      const i = Math.round(el.scrollLeft / pageW());
      if (i === 0) el.scrollLeft = N * pageW();
      else if (i === N+1) el.scrollLeft = pageW();
    }, 120);
  });
  window.addEventListener('resize', function() {
    const i = Math.max(1, Math.min(N, Math.round(el.scrollLeft / pageW()) || 1));
    el.scrollLeft = i * pageW();
  });
  bindArrows(el);
}

function bindArrows(el) {
  const step = () => el.clientWidth;
  const nx = $('#slNext'), pv = $('#slPrev');
  if (nx) nx.addEventListener('click', function() { el.scrollTo({left: el.scrollLeft + step(), behavior: 'smooth'}); });
  if (pv) pv.addEventListener('click', function() { el.scrollTo({left: el.scrollLeft - step(), behavior: 'smooth'}); });
}

/* ---- VIEW SWITCH ---- */
function setView(view, push) {
  document.body.dataset.view = view;
  localStorage.setItem('sarvasView', view);
  const a = $('#vShow'), b = $('#vTable');
  if (a) a.classList.toggle('active', view === 'show');
  if (b) b.classList.toggle('active', view === 'table');
  if (push) {
    try { history.replaceState(null, '', view === 'table' ? '#results' : '#gallery'); } catch(e) {}
  }
}

function initViews() {
  const v = localStorage.getItem('sarvasView') || 'show';
  setView(v, false);
  $('#vShow').addEventListener('click', function() { setView('show', true); });
  $('#vTable').addEventListener('click', function() { setView('table', true); });
  // hash handling
  window.addEventListener('hashchange', function() {
    const h = location.hash;
    if (h === '#results') { setView('table', false); scrollToEl($('#projTable')); }
    else if (h === '#gallery') { setView('show', false); scrollToEl($('#gallery')); }
  });
  // initial hash
  const h = location.hash;
  if (h === '#results') { setView('table', false); }
  else if (h === '#gallery') { setView('show', false); }
}

function scrollToEl(el) {
  if (!el) return;
  setTimeout(() => { el.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 60);
}

/* ---- LANGUAGE ---- */
function initLang() {
  const btn = $('#langBtn');
  btn.textContent = lang === 'ru' ? 'EN' : 'RU';
  btn.addEventListener('click', function() {
    const nl = lang === 'ru' ? 'en' : 'ru';
    localStorage.setItem('sarvasLang', nl);
    const u = new URL(location.href);
    u.searchParams.set('lang', nl);
    location.href = u.toString();
  });
}

/* ---- FLASH ON SKILL CLICK ---- */
function initFlash() {
  document.addEventListener('click', function(e) {
    const a = e.target.closest('a[href^="#skill-"]');
    if (!a) return;
    const t = document.querySelector(a.getAttribute('href'));
    if (t) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  });
}

/* ---- SCROLL TO TOP ---- */
function initTop() {
  const b = $('#scrollToTop');
  window.addEventListener('scroll', function() {
    b.style.display = window.scrollY > 300 ? 'block' : 'none';
  });
  b.addEventListener('click', function() {
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
}

/* ---- ANIMATION (reveal & counter) ---- */
function initAnim() {
  const io = new IntersectionObserver(function(entries) {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('on');
      entry.target.querySelectorAll('[data-to]').forEach(runCount);
      io.unobserve(entry.target);
    });
  }, {threshold: .18});
  $$('.reveal').forEach(el => io.observe(el));
}

function runCount(el) {
  if (el.dataset.done) return;
  el.dataset.done = '1';
  const raw = el.dataset.to;
  const m = raw.match(/^([\d.]+)(\+?)$/);
  if (!m) { el.textContent = raw; return; }
  const to = parseFloat(m[1]);
  const suffix = m[2] || '';
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = raw;
    return;
  }
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 1300);
    const e = 1 - Math.pow(1 - p, 3);
    const val = to % 1 ? (to * e).toFixed(1) : Math.round(to * e);
    el.textContent = val + (p === 1 ? suffix : '');
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---- MAIN INIT ---- */
function renderAll() {
  renderHero();
  renderNav();
  renderTicker();
  renderShowcase();
  renderTable();
  renderSkills();
  renderExperience();
  renderEducation();
  renderContacts();
  renderFooter();
  initViews();
  initFlash();
  initTop();
  initAnim();
  // re-fit lockup after fonts
  setTimeout(fitLockup, 300);
}

loadData()
  .then(() => {
    renderAll();
  })
  .catch(err => {
    const e = $('#err');
    if (e) {
      e.style.display = 'block';
      e.textContent = lang === 'ru' ? 'Не удалось загрузить данные.' : 'Failed to load content.';
    }
    console.error(err);
  });

// language init
initLang();

})();
</script>
